topics:
  - { id: introduction, order: 1, title: { en: "Introduction: sources, classical vs. modern contract law, the analytical framework", es: "Introducción: fuentes, derecho clásico vs. moderno, el marco de análisis" } }
  - { id: formation, order: 2, title: { en: "Formation: offer, acceptance, consideration, promissory estoppel, quasi-contract, UCC", es: "Formación: oferta, aceptación, consideration, promissory estoppel, cuasicontrato, UCC" }, barTested: true }
  - { id: defenses, order: 3, title: { en: "Enforceability defenses: statute of frauds, limitations, capacity, fraud, mistake, unconscionability", es: "Defensas contra la exigibilidad: statute of frauds, prescripción, capacidad, fraude, error, unconscionability" }, barTested: true }
  - { id: interpretation, order: 4, title: { en: "Contract analysis: interpretation, gap-filling, parol evidence (intro), modification (intro)", es: "Análisis del contrato: interpretación, gap-filling, parol evidence (intro), modificación (intro)" }, barTested: true }
  - { id: performance, order: 5, title: { en: "Justified nonperformance: conditions, substantial performance, repudiation", es: "Incumplimiento justificado: condiciones, cumplimiento sustancial, repudiación" }, barTested: true }
  - { id: excuse, order: 6, title: { en: "Excused nonperformance: impossibility, impracticability, frustration", es: "Incumplimiento excusado: imposibilidad, impracticabilidad, frustración" }, barTested: true }
  - { id: remedies, order: 7, title: { en: "Remedies: expectation, reliance, restitution, limits, specific performance", es: "Remedios: expectativa, confianza, restitución, límites, cumplimiento forzoso" }, barTested: true }
