about:
  en: "In U.S. law-school slang, Contracts is simply \"K\". It is the course that builds the common-law method: offer, acceptance and consideration first, then the defenses, interpretation, performance, breach and remedies."
  es: "En la jerga de las law schools, Contracts se abrevia \"K\". Es el curso que enseña el método del common law: oferta, aceptación y consideration primero; luego defensas, interpretación, cumplimiento, incumplimiento y remedios."
