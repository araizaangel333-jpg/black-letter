about:
  en: "The map of the whole system: how federal and state law fit together, what each branch can do, how courts work, and which rights limit all of it. The interactive court map lives here."
  es: "El mapa de todo el sistema: cómo encajan el derecho federal y el estatal, qué puede hacer cada poder, cómo funcionan los tribunales y qué derechos los limitan. El mapa judicial interactivo pertenece aquí."
