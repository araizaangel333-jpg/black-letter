about:
  en: "The skills course: research, case analysis, memos, rule explanation and application, counterarguments and citations. The one that teaches you to write like a U.S. lawyer."
  es: "El curso de habilidades: investigación, análisis de casos, memos, explicar y aplicar reglas, contraargumentos y citas. El que enseña a escribir como abogado estadounidense."
