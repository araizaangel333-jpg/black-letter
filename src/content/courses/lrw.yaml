  - { kind: citation-exercises, format: { en: "ICW citation exercises (Lexis) assigned by chapter each week; grading weights are in the Simple Syllabus (confirm)", es: "Ejercicios de citas del ICW (Lexis) asignados por capítulo cada semana; los pesos de calificación están en el Simple Syllabus (confirmar)" }, verified: false }
