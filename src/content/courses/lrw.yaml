  - { kind: memo, format: { en: "Office memo on an IIED claim under Texas law, built in stages: research case chart (Oct. 9), Discussion section of 2–3 pages (Oct. 26), full 5-page memo (Nov. 2) with individual feedback; the professor grades mechanics and substance", es: "Memo sobre un reclamo de IIED bajo derecho de Texas, por etapas: cuadro de casos (9 oct.), sección Discussion de 2–3 páginas (26 oct.), memo completo de 5 páginas (2 nov.) con retroalimentación individual; se califican la mecánica y el fondo" } }
