# Frases de clase. `term` es la frase; `en.definition` dice cuándo usarla; `es.explanation` la traduce.
subject: classroom
items:
  - { id: could-you-repeat, term: "Could you repeat the question, please?", register: phrase, topic: cold-call, en: { definition: "Buys ten seconds when you are called on. Say it calmly; it is normal." }, es: { explanation: "¿Podría repetir la pregunta, por favor? Ganar diez segundos no es fallar; quedarse callado sí." } }
  - { id: make-sure-facts, term: "Let me make sure I have the facts right: …", register: phrase, topic: cold-call, en: { definition: "Opens your answer by restating the key facts; shows you read the case and gives you a runway." }, es: { explanation: "Déjeme confirmar que tengo bien los hechos: … Repite los hechos clave y toma impulso." } }
  - { id: plaintiff-sued-for, term: "The plaintiff sued for …; the trial court …; the plaintiff appealed.", register: phrase, topic: cold-call, en: { definition: "The procedural posture in one sentence: who sued, what the lower court did, who appealed." }, es: { explanation: "El demandante demandó por …; el tribunal de primera instancia …; el demandante apeló. La postura procesal en una frase." } }
  - { id: issue-was-whether, term: "The issue was whether …", register: phrase, topic: cold-call, en: { definition: "States the legal question. Always “whether”, never “if”." }, es: { explanation: "La cuestión era si … Usa “whether”, no “if”." } }
  - { id: court-held-that, term: "The court held that …", register: phrase, topic: cold-call, en: { definition: "States the holding. “Held” is for the decision; “reasoned” is for the why." }, es: { explanation: "El tribunal resolvió que … “Held” es la decisión; “reasoned” es el razonamiento." } }
  - { id: court-reasoned-that, term: "The court reasoned that …", register: phrase, topic: cold-call, en: { definition: "Introduces the reasoning, in two or three steps." }, es: { explanation: "El tribunal razonó que … Introduce el razonamiento en dos o tres pasos." } }
  - { id: not-certain-but, term: "I'm not certain, but I'd argue … because …", register: phrase, topic: cold-call, en: { definition: "The honest way to answer a hypothetical you have not fully worked out. Professors reward the attempt." }, es: { explanation: "No estoy seguro, pero argumentaría … porque … La forma honesta de contestar una hipótesis." } }
  - { id: based-on-what-i-read, term: "I didn't get all the way through the reading, but based on what I read, …", register: phrase, topic: cold-call, en: { definition: "If you are behind, say so once and still answer. Never just “I'm not prepared”." }, es: { explanation: "No terminé la lectura, pero con lo que leí, … Si vas atrasado, dilo una vez y contesta de todos modos." } }
  - { id: take-a-second, term: "Can I take a second to find it in my notes?", register: phrase, topic: cold-call, en: { definition: "Polite request for a pause; most professors allow it." }, es: { explanation: "¿Me da un segundo para encontrarlo en mis notas?" } }
  - { id: it-depends-on-whether, term: "I think it depends on whether …", register: phrase, topic: cold-call, en: { definition: "The lawyer's answer: identify the fact or rule that decides it." }, es: { explanation: "Creo que depende de si … La respuesta de abogado: señala el hecho o la regla que decide." } }
  - { id: could-you-clarify, term: "Could you clarify what you mean by …?", register: phrase, topic: clarifying, en: { definition: "Asks for precision without sounding lost." }, es: { explanation: "¿Podría aclarar qué quiere decir con …?" } }
  - { id: are-you-asking-whether, term: "Are you asking whether …?", register: phrase, topic: clarifying, en: { definition: "Reframes the question in your own words; confirms you understood." }, es: { explanation: "¿Me pregunta si …? Reformula la pregunta y confirma que entendiste." } }
  - { id: lost-you-at, term: "Sorry, I lost you at …", register: phrase, topic: clarifying, en: { definition: "Points to the exact moment you stopped following." }, es: { explanation: "Perdón, me perdí en … Señala el momento exacto en que dejaste de seguir." } }
  - { id: give-an-example, term: "Could you give an example?", register: phrase, topic: clarifying, en: { definition: "Turns an abstract rule into a fact pattern." }, es: { explanation: "¿Podría dar un ejemplo?" } }
  - { id: go-back, term: "Can we go back to the previous point?", register: phrase, topic: clarifying, en: { definition: "Returns to something you need to settle before moving on." }, es: { explanation: "¿Podemos volver al punto anterior?" } }
  - { id: make-sure-i-understood, term: "Just to make sure I understood: …", register: phrase, topic: clarifying, en: { definition: "Restates the point in your words and invites correction." }, es: { explanation: "Solo para asegurarme de que entendí: …" } }
  - { id: push-back, term: "I'd push back on that: …", register: phrase, topic: discussion, en: { definition: "Polite disagreement with a classmate or the professor." }, es: { explanation: "Yo discreparía de eso: … Desacuerdo educado." } }
  - { id: build-on, term: "I'd like to build on what [name] said.", register: phrase, topic: discussion, en: { definition: "Adds to a classmate's point; the standard way to enter a discussion." }, es: { explanation: "Quisiera añadir a lo que dijo [nombre]. La forma habitual de entrar en la discusión." } }
  - { id: on-the-one-hand, term: "On the one hand …; on the other hand …", register: phrase, topic: discussion, en: { definition: "Presents both sides before choosing; what counter-analysis sounds like out loud." }, es: { explanation: "Por un lado …; por otro lado … Así suena el counter-analysis en voz alta." } }
  - { id: majority-dissent, term: "The majority held …, but the dissent argued …", register: phrase, topic: discussion, en: { definition: "Shows you read the whole opinion, including the dissent." }, es: { explanation: "La mayoría resolvió …, pero el voto disidente argumentó …" } }
  - { id: restatement-ucc, term: "Under the Restatement, …; under the UCC, …", register: phrase, topic: discussion, en: { definition: "Contracts habit: state the common-law rule and the UCC rule separately." }, es: { explanation: "Bajo el Restatement, …; bajo el UCC, … Hábito de Contracts: separar la regla de common law y la del UCC." } }
  - { id: would-outcome-change, term: "Would the outcome change if …?", register: phrase, topic: discussion, en: { definition: "The question professors ask; ask it yourself to practice hypotheticals." }, es: { explanation: "¿Cambiaría el resultado si …? La pregunta típica del profesor; hazla tú para practicar." } }
  - { id: square-with, term: "How does this square with [case]?", register: phrase, topic: discussion, en: { definition: "Asks how two cases fit together or conflict." }, es: { explanation: "¿Cómo se concilia esto con [caso]?" } }
  - { id: disagree-with-court, term: "I disagree with the court because …", register: phrase, topic: discussion, en: { definition: "Taking a position is welcome, as long as you give a reason." }, es: { explanation: "No estoy de acuerdo con el tribunal porque … Tomar posición está bien si das una razón." } }
  - { id: minute-after-class, term: "Do you have a minute after class? I have a question about …", register: phrase, topic: office-hours, en: { definition: "How to approach a professor after class." }, es: { explanation: "¿Tiene un minuto después de clase? Tengo una pregunta sobre …" } }
  - { id: follow-up-by-email, term: "I'll follow up by email.", register: phrase, topic: office-hours, en: { definition: "Closes a conversation and promises a written message." }, es: { explanation: "Le escribo por correo. Cierra la conversación y promete un mensaje escrito." } }
  - { id: recommend-source, term: "Could you recommend a secondary source on …?", register: phrase, topic: office-hours, en: { definition: "Asks for a treatise, hornbook or article; a good office-hours question." }, es: { explanation: "¿Me recomienda una fuente secundaria sobre …? Buena pregunta para horas de oficina." } }
  - { id: difference-between, term: "What's the difference between X and Y?", register: phrase, topic: office-hours, en: { definition: "The simplest useful question; use it often." }, es: { explanation: "¿Cuál es la diferencia entre X y Y?" } }
  - { id: fair-to-say, term: "Is it fair to say that …?", register: phrase, topic: office-hours, en: { definition: "Checks a summary you made against the professor's view." }, es: { explanation: "¿Es correcto decir que …? Verifica tu resumen con el profesor." } }
  - { id: clears-it-up, term: "Thanks, that clears it up.", register: phrase, topic: office-hours, en: { definition: "Signals the doubt is resolved." }, es: { explanation: "Gracias, ya quedó claro." } }
